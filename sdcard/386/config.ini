; X86Pi machine configuration.
; The settings menu (Win+F11) and the disk manager (Win+F12) rewrite this file.

[pc]
mem=16M
vga_mem=8192K
cpu=4
fpu=1
bios=bios.bin
vga_bios=vgabios.bin

; Disk images, in this folder: fda/fdb floppies, hda/hdb hard disks on the
; first IDE channel.  CD-ROM images (.iso), the second channel and USB floppy
; drives are chosen in the disk manager (Win+F12).
;hda=hdd.img
;fda=floppy.img

[X86Pi]
volume=12
pcspeaker=1
adlib=1
soundblaster=1
mpu401=1
tandy=0
covox=0
dss=0
mouse=1
mouse_invert_y=0
mouse_speed=100
joystick=0
power_restore=1
power_button=0

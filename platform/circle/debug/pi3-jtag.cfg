# Use adapter serial <your Pico serial> on the command line before this file.
source [find interface/cmsis-dap.cfg]
transport select jtag
source [find target/bcm2837.cfg]
# bcm2837.cfg sets 4000 kHz, so override AFTER sourcing it.
adapter speed 100
# RUN/nRESET is not wired; do not pulse a system reset.
reset_config none

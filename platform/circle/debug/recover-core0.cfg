# Opt-in recovery for an interrupted AArch64 debug memory transfer.
# Run AFTER pi3-jtag.cfg and BEFORE init. Does not reset or resume the CPU.
# OpenOCD armv8.h: DSCR=debug_base+0x88, DRCR=+0x90.
# armv8_dpm.h: DSCR_MA=bit20, DRCR_CSE=bit2.
bcm2837.cpu0 configure -event examine-start {
    set dscr [lindex [bcm2837.ap read_memory 0x80010088 32 1] 0]
    echo [format "Recovery: core0 DSCR before = 0x%08x" $dscr]
    bcm2837.ap write_memory 0x80010088 32 [list [expr {$dscr & ~0x100000}]]
    bcm2837.ap write_memory 0x80010090 32 {4}
}
